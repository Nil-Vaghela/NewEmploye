
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSU CFA</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        :root {
            --red: #D70F26;
            --red-dark: #b30f22;
            --card-bg: rgba(255,255,255,.62);
            --card-border: rgba(255,255,255,.9);
            --text: #22201f;
            --text-muted: #8a746e;
        }
        html, body {
            min-height: 100vh;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            padding: 40px 16px 70px;
            background:
                radial-gradient(60% 45% at 8% 0%, rgba(215,15,38,.14) 0%, rgba(215,15,38,0) 60%),
                radial-gradient(50% 40% at 100% 100%, rgba(255,196,74,.18) 0%, rgba(255,196,74,0) 60%),
                linear-gradient(180deg, #fffdfb 0%, #f7efe9 100%);
            background-attachment: fixed;
        }
        .container {
            max-width: 760px;
        }
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(120,20,30,.12), inset 0 1px 0 rgba(255,255,255,.8);
        }
        .header {
            text-align: center;
            padding: 32px 30px 24px;
            margin-bottom: 24px;
        }
        .header .badge {
            width: 72px; height: 72px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background: rgba(255,255,255,.85);
            border: 1px solid rgba(215,15,38,.12);
            box-shadow: 0 6px 16px rgba(120,20,30,.10);
            display: flex; align-items: center; justify-content: center;
        }
        .header .badge img {
            width: 48px; height: 48px; object-fit: contain;
        }
        .header h1 {
            font-size: 19px;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }
        .form-container {
            padding: 0 40px 32px;
        }
        .form-group label {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .form-control {
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(215,15,38,.14);
            color: var(--text);
            border-radius: 12px;
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--red);
            color: var(--text);
            box-shadow: 0 0 0 .2rem rgba(215,15,38,.14);
        }
        .btn-primary {
            background: linear-gradient(135deg, #e3243b, var(--red-dark));
            border: none;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(215,15,38,.28);
        }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background: linear-gradient(135deg, #ef2c44, #c11527);
            box-shadow: 0 12px 28px rgba(215,15,38,.36);
        }
        .btn-outline-light {
            border-radius: 12px;
            border: 1px solid rgba(215,15,38,.18);
            color: var(--red-dark);
            background: rgba(215,15,38,.06);
            font-weight: 700;
        }
        .btn-outline-light:hover {
            background: rgba(215,15,38,.12);
            color: var(--red-dark);
        }
        .btn-spacing {
            margin: 10px 6px 0 0;
        }
        .table-container {
            padding: 30px 26px 34px;
            margin-top: 30px;
            overflow-x: auto;
        }
        .table-container h2 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: var(--text);
            margin: 0 0 20px;
        }
        .table-container table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            color: var(--text);
            font-weight: 500;
        }
        .table-container th, .table-container td {
            border: none;
            border-bottom: 1px solid rgba(120,20,30,.08);
            padding: 12px 14px;
            background: transparent;
        }
        .table-container th {
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            color: #fff;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: .04em;
        }
        .table-container th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .table-container th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .table-container tbody tr:hover {
            background: rgba(215,15,38,.05);
        }
        .table-container td:first-child {
            font-size: 1.6em;
        }
        .note-text {
            text-align: center;
            color: #a89e98;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
