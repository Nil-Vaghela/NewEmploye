<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        html, body {
            min-height: 100vh;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Roboto', Arial, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 70px;
            padding-top: 20px;
        }
        .container {
            max-width: 700px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 200px;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: bold;
            color: #D70F26;
        }
        .form-container {
            margin-bottom: 30px;
        }
        .form-group label {
            font-weight: bold;
            color: #333;
        }
        .btn-primary {
            background-color: #D70F26;
            border-color: #D70F26;
        }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background-color: #b90c1c;
            border-color: #b90c1c;
        }
        .table-container h2 {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #D70F26;
            margin-bottom: 20px;
        }
        .table-container table {
            color: #333;
        }
        .table-container th, .table-container td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .table-container th {
            background-color: #f2f2f2;
            color: #333;
        }
        .note-text {
        color: #D70F26;
        }
    </style>

    <style>
    /* Add this code to the end of the style block */
    
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://commkit.gsu.edu/files/2019/06/PrimaryLogo3color-768x594.jpg" alt="GSU Logo">
        <h1 class="text-center">Employee Attendance</h1>
    </div>
    <div class="form-container">
        <form method="post">
            <div class="form-group">
            <label for="username">User ID:</label>
            <input type="text" class="form-control" id="username" name="username" pattern="\d+" title="Please enter digits only" required>
            </div>
            <div class="form-group">
                <label>Action:</label>
                <select class="form-control" id="action" name="action">
                    <option value="Clock In">Clock In</option>
                    <option value="Clock Out">Clock Out</option>
                    <option value="Lunch In">Lunch In</option>
                    <option value="Lunch Out">Lunch Out</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" onclick="return confirmAction()">Submit</button>
        </form>
    </div>
    
    <div class="table-container">
        <h2 class="text-center">Employee Attendance Data</h2>
        {{ table|safe }}
        <p class="text-center note-text">Made By Nil ❤️</p>
    </div>
    
</div>


<script>
    // ... The existing JavaScript code remains unchanged (if any)

    // Disable the back button
    history.pushState(null, document.title, location.href);
    window.addEventListener('popstate', function (event) {
        history.pushState(null, document.title, location.href);
    });
</script>
<script>
function confirmAction() {
    var action = document.getElementById("action").value;
    return confirm("Are you sure you want to " + action + "?");
}
</script>

</body>
</html>
