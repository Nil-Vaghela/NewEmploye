# Nginx reverse proxy for gsucfa.com / www.gsucfa.com -> Gunicorn (unix socket).
# Install: sudo cp deploy/nginx_gsucfa.conf /etc/nginx/sites-available/gsucfa
#          sudo ln -s /etc/nginx/sites-available/gsucfa /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY.md) - it will rewrite this file to add HTTPS.

server {
    listen 80;
    server_name gsucfa.com www.gsucfa.com;

    client_max_body_size 10M;

    location /static/ {
        alias /home/gsucfa/GSU-Employe-Attendance-old-state/static/;
    }

    location / {
        proxy_pass http://unix:/home/gsucfa/GSU-Employe-Attendance-old-state/gsucfa.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
