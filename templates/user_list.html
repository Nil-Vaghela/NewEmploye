<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            min-height: 100vh;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Roboto', Arial, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 70px;
            padding-top: 20px;
        }
        .container {
            max-width: 700px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 200px;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 30px;
            font-weight: bold;
            color: #D70F26;
        }
        .form-container {
            margin-bottom: 30px;
        }
        .form-group label {
            font-weight: bold;
            color: #333;
        }
        .btn-primary {
            background-color: #D70F26;
            border-color: #D70F26;
        }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background-color: #b90c1c;
            border-color: #b90c1c;
        }
        .table-container h2 {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #D70F26;
            margin-bottom: 20px;
        }
        .table-container table {
            color: #333;
        }
        .table-container th, .table-container td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .table-container th {
            background-color: #f2f2f2;
            color: #333;
        }
        .note-text {
            color: #D70F26;
        }
    </style>
    
    <title>View Employe Data - {{ filename }}</title>
    <!-- Add CSS for Chick-fil-A theme -->
</head>
<body>
    <div class="container">
        <h2>Employee List</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>User ID</th>
                    <th>Points</th>
                    <th>View Profile</th>
                    <th>Delete User</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.Name }}</td>
                        <td>{{ user['User ID'] }}</td>
                        <td>{{ user.Points }}</td>
                        <td>
                            <a href="{{ url_for('edit_points', user_id=user['User ID']) }}" class="btn btn-primary btn-sm">View Profile</a>
                        </td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_user', user_id=user['User ID']) }}" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <input type="submit" class="btn btn-danger btn-sm" value="Delete">
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
