
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GSU Attendance</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        :root {
            --red: #D70F26;
            --red-dark: #b30f22;
            --card-bg: rgba(255,255,255,.62);
            --card-border: rgba(255,255,255,.9);
            --text: #22201f;
            --text-muted: #8a746e;
        }
        html, body {
            min-height: 100vh;
            margin: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(60% 50% at 8% 0%, rgba(215,15,38,.14) 0%, rgba(215,15,38,0) 60%),
                radial-gradient(55% 45% at 100% 100%, rgba(255,196,74,.18) 0%, rgba(255,196,74,0) 60%),
                linear-gradient(180deg, #fffdfb 0%, #f7efe9 100%);
            background-attachment: fixed;
        }
        .container {
            max-width: 380px;
            width: 100%;
            padding: 38px 34px;
            border-radius: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(120,20,30,.14), inset 0 1px 0 rgba(255,255,255,.8);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header .badge {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: rgba(255,255,255,.85);
            border: 1px solid rgba(215,15,38,.12);
            box-shadow: 0 6px 16px rgba(120,20,30,.10);
            display: flex; align-items: center; justify-content: center;
        }
        .header .badge img {
            width: 42px; height: 42px; object-fit: contain;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }
        .form-group label {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .form-control {
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(215,15,38,.14);
            color: var(--text);
            border-radius: 12px;
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--red);
            color: var(--text);
            box-shadow: 0 0 0 .2rem rgba(215,15,38,.14);
        }
        .form-control::placeholder {
            color: #b8aca6;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e3243b, var(--red-dark));
            border: none;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(215,15,38,.28);
        }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background: linear-gradient(135deg, #ef2c44, #c11527);
            box-shadow: 0 12px 28px rgba(215,15,38,.36);
        }
        .note-text {
            color: #a89e98;
            font-size: 12px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge"><img src="https://commkit.gsu.edu/files/2019/06/PrimaryLogo3color-768x594.jpg" alt="GSU Logo"></div>
            <h1>GSU Attendance</h1>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="username">User ID</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <p class="text-center note-text" style="margin-top:16px;">Made By Nil &#10084;&#65039; &nbsp; V. 3.0.2</p>
        </form>
    </div>
</body>
</html>
